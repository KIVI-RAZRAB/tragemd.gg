<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Trademd.gg — Мобильный Трейдинг</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232962ff'/><path d='M8 20L14 14L18 18L24 10M24 10H19M24 10V15' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

<style>
/* =========================================================================
   1. BASE STYLES & VARIABLES
   ========================================================================= */
:root {
  --bg-main: #0b0e14;
  --bg-card: #141822;
  --bg-panel: #1a202c;
  --bg-input: #0f131d;
  
  --border: rgba(255, 255, 255, 0.08);
  --border-active: #2962ff;

  --text-main: #f1f5f9;
  --text-muted: #848e9c;
  --text-dim: #475569;

  --green: #0ecb81;
  --green-bg: rgba(14, 203, 129, 0.12);
  --red: #f6465d;
  --red-bg: rgba(246, 70, 93, 0.12);
  --blue: #2962ff;
  --blue-bg: rgba(41, 98, 255, 0.15);
  --gold: #f0b90b;
  --gold-bg: rgba(240, 185, 11, 0.15);

  --nav-h: 62px;
  --header-h: 56px;
  --radius: 14px;
  --radius-sm: 8px;
}

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%; height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.35;
}

.mono { font-family: 'JetBrains Mono', monospace; }
.hidden { display: none !important; }

/* =========================================================================
   2. ANIMATIONS & UI ELEMENTS
   ========================================================================= */
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(41, 98, 255, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(41, 98, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(41, 98, 255, 0); } }

.svg-icon {
  width: 18px; height: 18px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  display: inline-block; vertical-align: middle;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 700;
  background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main);
  cursor: pointer; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap; outline: none;
}
.btn:active { transform: scale(0.96); opacity: 0.9; }
.btn.primary { background: var(--blue); border: none; color: #fff; box-shadow: 0 4px 12px rgba(41,98,255,0.3); }
.btn.buy { background: var(--green); border: none; color: #000; font-weight: 800; box-shadow: 0 4px 12px rgba(14,203,129,0.25); }
.btn.sell { background: var(--red); border: none; color: #fff; font-weight: 800; box-shadow: 0 4px 12px rgba(246,70,93,0.25); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.inp {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-main); font-size: 14px; font-weight: 600; outline: none;
  transition: border-color 0.15s ease;
}
.inp:focus { border-color: var(--blue); }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

/* =========================================================================
   3. LAYOUT & SCREENS
   ========================================================================= */
.auth-wrapper {
  position: fixed; inset: 0; z-index: 999;
  display: grid; place-items: center; padding: 18px;
  background: var(--bg-main);
}
.auth-card {
  width: 100%; max-width: 380px; padding: 24px; border-radius: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  text-align: center; animation: fadeIn 0.25s ease-out;
}
.brand-icon {
  width: 48px; height: 48px; border-radius: 12px; background: var(--blue);
  color: #fff; display: inline-grid; place-items: center; margin-bottom: 10px;
  animation: pulseGlow 2s infinite;
}
.auth-tabs { display: flex; background: var(--bg-input); padding: 3px; border-radius: var(--radius-sm); margin: 16px 0; }
.auth-tab { flex: 1; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--text-muted); border: none; background: transparent; cursor: pointer; }
.auth-tab.active { background: var(--bg-panel); color: var(--text-main); }
.captcha-box { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.captcha-box canvas { border-radius: 6px; background: #000; border: 1px solid var(--border); }
.err-msg { color: var(--red); font-size: 12px; font-weight: 600; min-height: 16px; margin-top: 8px; }

.app-layout { display: flex; flex-direction: column; width: 100vw; height: 100dvh; overflow: hidden; }

.header {
  height: var(--header-h); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; background: var(--bg-card); border-bottom: 1px solid var(--border);
}
.user-pill { display: flex; align-items: center; gap: 10px; }
.lvl-badge { padding: 2px 6px; border-radius: 6px; background: var(--gold-bg); color: var(--gold); font-size: 10.5px; font-weight: 800; }
.cash-display { font-size: 14px; font-weight: 800; color: var(--green); }

.content-area { flex: 1; height: calc(100dvh - var(--header-h) - var(--nav-h)); overflow-y: auto; position: relative; }

.bottom-nav {
  height: var(--nav-h); flex-shrink: 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bg-card); border-top: 1px solid var(--border); z-index: 100;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-muted); font-size: 10.5px; font-weight: 700; cursor: pointer; transition: 0.15s;
}
.nav-item.active { color: var(--blue); }

.page { height: 100%; display: flex; flex-direction: column; animation: slideUp 0.2s ease-out; }
.padding-box { padding: 14px; }
.card-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }

/* Market Grid */
.coin-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: background 0.15s;
}
.coin-row:active { background: rgba(255,255,255,0.03); }
.coin-left { display: flex; align-items: center; gap: 10px; }
.coin-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; }
.coin-symbol { font-weight: 800; font-size: 14px; }
.coin-name { font-size: 11px; color: var(--text-muted); }
.coin-right { text-align: right; }
.coin-price { font-weight: 800; font-size: 14px; }
.coin-chg { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
.coin-chg.up { color: var(--green); background: var(--green-bg); }
.coin-chg.down { color: var(--red); background: var(--red-bg); }

/* Terminal */
.terminal-screen { display: flex; flex-direction: column; height: 100%; }
.terminal-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-main); border-bottom: 1px solid var(--border); }
.tf-selector { display: flex; gap: 4px; }
.tf-btn { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--text-muted); background: transparent; border: none; cursor: pointer; }
.tf-btn.active { color: var(--text-main); background: var(--bg-panel); }

.chart-box { flex: 1; position: relative; width: 100%; min-height: 180px; background: var(--bg-main); }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.trade-panel-bottom { background: var(--bg-card); border-top: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.order-type-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pct-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

/* Shop & Profile components */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.stat-item label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.stat-item .val { font-size: 15px; font-weight: 800; margin-top: 2px; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shop-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }

/* Avatars */
.av-box { position: relative; width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0; }
.av-ring { position: absolute; inset: -2px; border-radius: 50%; z-index: 1; }
.av-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--bg-panel); display: grid; place-items: center; z-index: 2; font-weight: 800; font-size: 13px; }
.av-inner img { width: 100%; height: 100%; object-fit: cover; }

/* Modal & Toast */
#toast-container { position: fixed; top: 12px; left: 14px; right: 14px; z-index: 1000; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
.toast { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); box-shadow: 0 8px 24px rgba(0,0,0,0.6); animation: fadeIn 0.2s ease; display: flex; align-items: center; gap: 8px; }
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.err { border-color: var(--red); color: var(--red); }

.modal-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,0.7); display: grid; place-items: center; padding: 16px; animation: fadeIn 0.15s ease; }
.modal-body { width: 100%; max-width: 360px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
</style>
</head>
<body>

<!-- =========================================================================

<div id="auth-screen" class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-icon">
      <svg class="svg-icon" style="width:26px; height:26px;" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>

<!-- =========================================================================
   JAVASCRIPT GAME ENGINE & CONTROLLERS
   ========================================================================= -->
<script>
/* Audio Effects Engine (Web Audio API) */
class SoundFx {
  constructor() { this.ctx = null; this.enabled = true; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  play(type) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    const now = this.ctx.currentTime;

    if (type === 'buy') {
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'sell') {
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'click') {
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    }
  }
}
const sounds = new SoundFx();

/* SVG Helpers */
const SVG = {
  check: `<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
  alert: `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  gift: `<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/></svg>`,
  star: `<svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
};

/* State & Storage */
const ASSETS = {
  MDC: { name: 'Mendeleev Coin', symbol: 'MDC', color: '#2962ff', price: 140.00 },
  PDL: { name: 'Poodle Token', symbol: 'PDL', color: '#9d56ff', price: 42.50 },
  CNC: { name: 'ChainCore', symbol: 'CNC', color: '#0ecb81', price: 15.20 },
  BCC: { name: 'BitCore Cash', symbol: 'BCC', color: '#f0b90b', price: 480.00 }
};

const SHOP = {
  frames: [
    { id: 'fr_base', name: 'Стандарт', price: 0, style: 'border:2px solid var(--border)' },
    { id: 'fr_blue', name: 'Неон Синий', price: 2500, style: 'border:2px solid #2962ff; box-shadow:0 0 10px #2962ff' },
    { id: 'fr_gold', name: 'Золото', price: 10000, style: 'border:2px solid #f0b90b; box-shadow:0 0 10px #f0b90b' },
    { id: 'fr_red', name: 'Огонь', price: 25000, style: 'border:2px solid #f6465d; box-shadow:0 0 12px #f6465d' }
  ],
  nicks: [
    { id: 'nk_base', name: 'Стандарт', price: 0, color: 'var(--text-main)' },
    { id: 'nk_blue', name: 'Неон', price: 3000, color: '#2962ff' },
    { id: 'nk_green', name: 'Профи', price: 7000, color: '#0ecb81' },
    { id: 'nk_gold', name: 'VIP Gold', price: 15000, color: '#f0b90b' }
  ]
};

const PROMOS = {
  'START2026': { cash: 5000, msg: '+ $5,000 на счёт!' },
  'TRADEMD': { cash: 12000, msg: '+ $12,000 бонуса!' },
  'PUMPKIN': { frame: 'fr_gold', msg: 'Золотая рамка unlocked!' }
};

let DB = {
  users: JSON.parse(localStorage.getItem('tm_users_v4') || '{}'),
  session: localStorage.getItem('tm_session_v4') || null
};

let marketHistory = {};
let currentNav = 'market';
let activeSym = 'MDC';
let captchaCode = '';
let authMode = 'login';
let priceAlerts = [];

Object.keys(ASSETS).forEach(s => {
  const base = ASSETS[s].price;
  marketHistory[s] = Array.from({length: 35}, () => base + (Math.random() * 4 - 2));
});

function saveDB() {
  localStorage.setItem('tm_users_v4', JSON.stringify(DB.users));
  if (DB.session) localStorage.setItem('tm_session_v4', DB.session);
  else localStorage.removeItem('tm_session_v4');
}

function getUser() { return DB.session ? DB.users[DB.session] : null; }
function fmtUSD(v) { return '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function getReqXP(lvl) { return Math.floor(100 * Math.pow(lvl, 1.3)); }

function toast(msg, type = 'ok') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `${type === 'ok' ? SVG.check : SVG.alert} <span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function addXP(u, amount) {
  u.xp += amount;
  let req = getReqXP(u.level);
  let leveled = false;
  while (u.xp >= req) {
    u.xp -= req;
    u.level++;
    req = getReqXP(u.level);
    leveled = true;
  }
  if (leveled) {
    toast(`Новый уровень: ${u.level}!`, 'ok');
    if (typeof confetti === 'function') confetti({ particleCount: 70, origin: { y: 0.7 } });
  }
  saveDB();
  renderHeader();
}

/* Market Ticker Loop */
setInterval(() => {
  Object.keys(ASSETS).forEach(s => {
    const hist = marketHistory[s];
    const lastP = hist[hist.length - 1];
    const delta = (Math.random() - 0.495) * (lastP * 0.015);
    const newP = Math.max(0.1, lastP + delta);

    hist.push(newP);
    if (hist.length > 40) hist.shift();
    ASSETS[s].price = newP;

    // Check alerts
    priceAlerts = priceAlerts.filter(a => {
      if (a.sym === s) {
        if ((a.dir === 'above' && newP >= a.target) || (a.dir === 'below' && newP <= a.target)) {
          toast(`Алерт: ${s} достиг ${fmtUSD(newP)}!`, 'ok');
          return false;
        }
      }
      return true;
    });
  });

  if (DB.session) {
    renderHeader();
    if (currentNav === 'market') renderMarketRows();
    if (currentNav === 'trade') {
      updateTradeHeader();
      drawChart();
    }
  }
}, 1600);

/* Canvas Chart */
function drawChart() {
  const canvas = document.getElementById('chart-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;

  const w = canvas.width = parent.clientWidth;
  const h = canvas.height = parent.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const data = marketHistory[activeSym];
  if (!data || data.length === 0) return;

  const color = ASSETS[activeSym].color;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = (max - min) || 1;

  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const pts = data.map((v, i) => ({
    x: (i / (data.length - 1)) * w,
    y: h - ((v - min) / range) * (h - 24) - 12
  }));

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const xc = (pts[i].x + pts[i - 1].x) / 2;
    const yc = (pts[i].y + pts[i - 1].y) / 2;
    ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, xc, yc);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '35');
  grad.addColorStop(1, color + '00');
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  const last = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function renderHeader() {
  const u = getUser();

function switchNav(target) {
  sounds.play('click');
  currentNav = target;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.remove('active');
    if (el.getAttribute('onclick').includes(target)) el.classList.add('active');
  });

  const main = document.getElementById('main-view');
  const u = getUser();

  if (target === 'market') renderMarketView(main);
  else if (target === 'trade') renderTradeView(main, u);
  else if (target === 'portfolio') renderPortfolioView(main, u);
  else if (target === 'profile') renderProfileView(main, u);
}

/* Trade Page */

  container.className = 'content-area page terminal-screen';
  container.innerHTML = `
    <div class="terminal-bar">
      <div>
        <b style="font-size:16px;" id="tr-sym">${activeSym}/USD</b>
        <div class="mono" style="font-size:14px; font-weight:800; color:${ASSETS[activeSym].color};" id="tr-price">${fmtUSD(ASSETS[activeSym].price)}</div>
      </div>
      <div class="tf-selector">
        <button class="tf-btn active">1M</button>
        <button class="tf-btn">5M</button>
        <button class="tf-btn">1H</button>
      </div>
    </div>

    <div class="chart-box">

        <span>Доступно: <b class="mono" style="color:var(--text-main);">${fmtUSD(u.cash)}</b></span>
        <span>Баланс: <b class="mono" style="color:var(--text-main);">${owned.toFixed(4)} ${activeSym}</b></span>
      </div>

      <div class="field" style="margin-bottom:0;">
        <input type="number" id="trade-qty" class="inp mono" placeholder="Количество" step="any" oninput="calcTradeTotal()">
      </div>

      <div class="pct-btns">
        <button class="btn sm" onclick="setQuickPct(0.25)">25%</button>
        <button class="btn sm" onclick="setQuickPct(0.50)">50%</button>
        <button class="btn sm" onclick="setQuickPct(0.75)">75%</button>
        <button class="btn sm" onclick="setQuickPct(1.00)">100%</button>
      </div>

      <div style="font-size:12px; display:flex; justify-content:space-between; margin-bottom:2px;">
        <span style="color:var(--text-muted);">Стоимость:</span>
        <b class="mono" id="trade-total-val">$0.00</b>
      </div>

      <div class="order-type-tabs">
        <button class="btn buy full" onclick="doTrade('buy')">Купить ${activeSym}</button>
        <button class="btn sell full" onclick="doTrade('sell')" ${owned <= 0 ? 'disabled' : ''}>Продать</button>
      </div>
    </div>
  `;

  setTimeout(() => drawChart(), 40);

function updateTradeHeader() {
  const p = document.getElementById('tr-price');
  if (p) p.textContent = fmtUSD(ASSETS[activeSym].price);
}

function calcTradeTotal() {
  const qty = parseFloat(document.getElementById('trade-qty').value) || 0;
  const tot = document.getElementById('trade-total-val');
  if (tot) tot.textContent = fmtUSD(qty * ASSETS[activeSym].price);
}

function setQuickPct(pct) {
  sounds.play('click');
  const u = getUser();
  const price = ASSETS[activeSym].price;
  const inp = document.getElementById('trade-qty');
  if (!inp) return;

  const availUSD = u.cash * pct;
  const qty = availUSD / price;
  inp.value = qty.toFixed(4);
  calcTradeTotal();
}

function doTrade(type) {
  const u = getUser();
  const price = ASSETS[activeSym].price;
  const inp = document.getElementById('trade-qty');
  const qty = parseFloat(inp.value) || 0;

  if (qty <= 0) {
    toast('Введите количество!', 'err');
    return;
  }

  const cost = qty * price;

  if (type === 'buy') {
    if (u.cash < cost) {
      toast('Недостаточно средств!', 'err');
      return;
    }
    const currQty = u.portfolio[activeSym] || 0;
    const currAvg = u.buyPrices[activeSym] || price;
    const newQty = currQty + qty;
    const newAvg = ((currQty * currAvg) + cost) / newQty;

    u.cash -= cost;
    u.portfolio[activeSym] = newQty;
    u.buyPrices[activeSym] = newAvg;
    addXP(u, Math.max(5, Math.floor(cost / 40)));
    sounds.play('buy');

  } else {
    const currQty = u.portfolio[activeSym] || 0;
    if (currQty < qty) {
      toast('Недостаточно монет для продажи!', 'err');
      return;
    }
    u.cash += cost;
    u.portfolio[activeSym] = currQty - qty;
    if (u.portfolio[activeSym] <= 0.0001) {
      delete u.portfolio[activeSym];
      delete u.buyPrices[activeSym];
    }
    addXP(u, Math.max(5, Math.floor(cost / 40)));
    sounds.play('sell');
  }

  saveDB();
  toast('Сделка проведена!', 'ok');
  renderTradeView(document.getElementById('main-view'), u);
  renderHeader();
}

/* Portfolio Page */
function renderPortfolioView(container, u) {
  container.className = 'content-area page padding-box';
  let cryptoVal = 0, totalCost = 0;

  Object.keys(u.portfolio).forEach(s => {
    const q = u.portfolio[s];
    if (q > 0) {
      cryptoVal += q * ASSETS[s].price;
      totalCost += (u.buyPrices[s] || ASSETS[s].price) * q;
    }
  });

  const totalCap = u.cash + cryptoVal;
  const pnl = cryptoVal - totalCost;

  container.innerHTML = `
    <h3 style="font-weight:900; font-size:18px; margin-bottom:12px;">Мой Портфель</h3>

    <div class="stat-grid">
      <div class="stat-item">
        <label>Капитал</label>
        <div class="val mono" style="color:var(--blue);">${fmtUSD(totalCap)}</div>
      </div>
      <div class="stat-item">
        <label>PnL Сделок</label>
        <div class="val mono" style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'};">
          ${pnl >= 0 ? '+' : ''}${fmtUSD(pnl)}
        </div>
      </div>
    </div>

    <div class="card-panel">
      <h4 style="font-weight:800; margin-bottom:10px;">Открытые Позиции</h4>
      ${Object.keys(u.portfolio).filter(s => u.portfolio[s] > 0).map(s => {
        const q = u.portfolio[s];
        const currP = ASSETS[s].price;
        const avgP = u.buyPrices[s] || currP;
        const val = q * currP;
        const itemPnl = (currP - avgP) * q;

        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
            <div>
              <b style="color:${ASSETS[s].color};">${s}</b>
              <div style="font-size:11px; color:var(--text-muted);">${q.toFixed(4)} по ${fmtUSD(avgP)}</div>
            </div>
            <div style="text-align:right;">
              <div class="mono" style="font-weight:800;">${fmtUSD(val)}</div>
              <div class="mono" style="font-size:11px; color:${itemPnl >= 0 ? 'var(--green)' : 'var(--red)'};">
                ${itemPnl >= 0 ? '+' : ''}${fmtUSD(itemPnl)}
              </div>
            </div>
          </div>
        `;
      }).join('') || '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:10px 0;">Нет активных позиций</div>'}
    </div>
  `;
}

          <div class="shop-card">
            <div style="font-size:12px; font-weight:800; margin-bottom:6px;">${f.name}</div>
            <button class="btn sm full ${u.frame === f.id ? 'primary' : ''}" onclick="buyItem('frame', '${f.id}')">
              ${u.frame === f.id ? 'Надето' : (u.inventory.includes(f.id) ? 'Надеть' : fmtUSD(f.price))}
            </button>
          </div>
        `).join('')}
      </div>
    </div>

      <h4 style="font-weight:800; margin-bottom:10px;">Цвет Никнейма</h4>

          <div class="shop-card">

            <button class="btn sm full ${u.nickColor === n.id ? 'primary' : ''}" onclick="buyItem('nick', '${n.id}')">
              ${u.nickColor === n.id ? 'Надето' : (u.inventory.includes(n.id) ? 'Надеть' : fmtUSD(n.price))}
            </button>
          </div>
        `).join('')}
      </div>
    </div>

    <button class="btn sell full" onclick="logout()" style="margin-top:10px;">Выйти из аккаунта</button>
  `;
}

function buyItem(type, id) {
  sounds.play('click');
  const u = getUser();
  const list = type === 'frame' ? SHOP.frames : SHOP.nicks;
  const item = list.find(x => x.id === id);
  if (!item) return;

  if (u.inventory.includes(id)) {
    if (type === 'frame') u.frame = id;
    else u.nickColor = id;
    toast('Оформление применено!', 'ok');
  } else {
    if (u.cash < item.price) {
      toast('Недостаточно средств!', 'err');
      return;
    }
    u.cash -= item.price;
    u.inventory.push(id);
    if (type === 'frame') u.frame = id;
    else u.nickColor = id;
    toast('Покупка успешна!', 'ok');
  }

  saveDB();
  renderHeader();
  renderProfileView(document.getElementById('main-view'), u);
}

function applyPromo() {
  sounds.play('click');
  const inp = document.getElementById('promo-inp');
  const code = (inp.value || '').trim().toUpperCase();
  const u = getUser();

  if (u.usedPromos.includes(code)) {
    toast('Промокод уже использован!', 'err');
    return;
  }

  const p = PROMOS[code];
  if (!p) {
    toast('Неверный промокод!', 'err');
    return;
  }

  u.usedPromos.push(code);
  if (p.cash) u.cash += p.cash;
  if (p.frame) {
    if (!u.inventory.includes(p.frame)) u.inventory.push(p.frame);
    u.frame = p.frame;
  }

  saveDB();
  toast(p.msg, 'ok');
  inp.value = '';
  renderHeader();
  renderProfileView(document.getElementById('main-view'), u);
}

function addAlert() {

  }

/* Auth System */
function setAuthTab(mode) {
  sounds.play('click');
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-reg').classList.toggle('active', mode === 'register');
  document.getElementById('reg-box').classList.toggle('hidden', mode === 'login');
  document.getElementById('auth-btn').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('auth-err').textContent = '';
  if (mode === 'register') initCaptcha();
}

function initCaptcha() {
  const canvas = document.getElementById('captcha-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0f131d'; ctx.fillRect(0, 0, 140, 38);

  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  captchaCode = Array.from({length: 5}, () => chars[Math.floor(Math.random() * chars.length)]).join('');

  ctx.font = 'bold 20px "JetBrains Mono", monospace';
  ctx.fillStyle = '#2962ff';
  ctx.textAlign = 'center';
  ctx.fillText(captchaCode, 70, 26);

  for(let i=0; i<4; i++) {
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.moveTo(Math.random()*140, Math.random()*38);
    ctx.lineTo(Math.random()*140, Math.random()*38);
    ctx.stroke();
  }
}

function handleAuth(e) {
  e.preventDefault();
  sounds.play('click');
  const login = document.getElementById('auth-login').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-err');

  if (authMode === 'register') {
    const pass2 = document.getElementById('auth-pass2').value;
    const captcha = document.getElementById('auth-captcha').value.trim().toUpperCase();

    if (pass !== pass2) { err.textContent = 'Пароли не совпадают!'; return; }
    if (captcha !== captchaCode) { err.textContent = 'Неверный код с картинки!'; initCaptcha(); return; }
    if (DB.users[login]) { err.textContent = 'Пользователь уже существует!'; return; }

    DB.users[login] = {
      login, pass, cash: 10000.00, level: 1, xp: 0,
      portfolio: {}, buyPrices: {}, inventory: ['fr_base', 'nk_base'],
      frame: 'fr_base', nickColor: 'nk_base', usedPromos: [], customAvatar: null
    };
    DB.session = login;
    saveDB();
    startApp();
  } else {
    const u = DB.users[login];
    if (!u || u.pass !== pass) { err.textContent = 'Неверный логин или пароль!'; return; }
    DB.session = login;
    saveDB();
    startApp();
  }
}

function logout() {
  sounds.play('click');
  DB.session = null;
  saveDB();
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

function startApp() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  renderHeader();
  switchNav('market');
}

// Auto Auto-login initialization
window.addEventListener('DOMContentLoaded', () => {
  if (DB.session && DB.users[DB.session]) {
    startApp();
  } else {
    initCaptcha();
  }
});
</script>
