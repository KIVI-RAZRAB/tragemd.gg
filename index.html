<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Trademd.gg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
/* =========================================================================
   1. MOBILE-FIRST SYSTEM & BASE VARIABLES (BINANCE / BYBIT DARK STYLES)
   ========================================================================= */
:root {
  --bg-main: #0b0e14;
  --bg-card: #141822;
  --bg-panel: #1a202c;
  --bg-input: #0f131d;
  
  --border: rgba(255, 255, 255, 0.07);
  --border-active: #2962ff;

  --text-main: #f1f5f9;
  --text-muted: #848e9c;
  --text-dim: #475569;

  --green: #0ecb81;
  --green-bg: rgba(14, 203, 129, 0.12);
  --red: #f6465d;
  --red-bg: rgba(246, 70, 93, 0.12);
  --blue: #2962ff;
  --gold: #f0b90b;

  --nav-h: 62px;
  --header-h: 56px;
  --radius: 12px;
  --radius-sm: 8px;
}

* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%; height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.35;
}

.mono { font-family: 'JetBrains Mono', monospace; }
.hidden { display: none !important; }

/* =========================================================================
   2. TOUCH ANIMATIONS & MICRO-INTERACTIONS
   ========================================================================= */
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes flashGreen { 0% { color: var(--green); background: var(--green-bg); } 100% { color: inherit; background: transparent; } }
@keyframes flashRed { 0% { color: var(--red); background: var(--red-bg); } 100% { color: inherit; background: transparent; } }
@keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(14, 203, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 203, 129, 0); } }

.flash-up { animation: flashGreen 0.6s ease-out; }
.flash-down { animation: flashRed 0.6s ease-out; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 700;
  background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main);
  cursor: pointer; transition: transform 0.1s ease, background 0.15s ease, opacity 0.15s ease;
  white-space: nowrap; outline: none;
}
.btn:active { transform: scale(0.96); }
.btn.primary { background: var(--blue); border: none; color: #fff; }
.btn.buy { background: var(--green); border: none; color: #000; font-weight: 800; }
.btn.sell { background: var(--red); border: none; color: #fff; font-weight: 800; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

.inp {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-main); font-size: 14px; font-weight: 600; outline: none;
  transition: border-color 0.15s ease;
}
.inp:focus { border-color: var(--blue); }

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

/* =========================================================================
   3. AUTH SCREEN (MOBILE FIRST)
   ========================================================================= */
.auth-wrapper {
  position: fixed; inset: 0; z-index: 999;
  display: grid; place-items: center; padding: 18px;
  background: var(--bg-main);
}
.auth-card {
  width: 100%; max-width: 380px; padding: 24px; border-radius: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  text-align: center; animation: fadeIn 0.25s ease-out;
}
.brand-icon {
  width: 44px; height: 44px; border-radius: 12px; background: var(--blue);
  color: #fff; font-size: 20px; font-weight: 900; display: inline-grid; place-items: center; margin-bottom: 10px;
}
.auth-tabs { display: flex; background: var(--bg-input); padding: 3px; border-radius: var(--radius-sm); margin: 16px 0; }
.auth-tab { flex: 1; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--text-muted); border: none; background: transparent; cursor: pointer; }
.auth-tab.active { background: var(--bg-panel); color: var(--text-main); }
.captcha-box { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.captcha-box canvas { border-radius: 6px; background: #000; border: 1px solid var(--border); }
.err-msg { color: var(--red); font-size: 12px; font-weight: 600; min-height: 16px; margin-top: 8px; }

/* =========================================================================
   4. FULLSCREEN APPLICATION LAYOUT
   ========================================================================= */
.app-layout {
  display: flex; flex-direction: column; width: 100vw; height: 100dvh; overflow: hidden;
}

/* Header */
.header {
  height: var(--header-h); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; background: var(--bg-card); border-bottom: 1px solid var(--border);
}
.user-pill { display: flex; align-items: center; gap: 8px; }
.lvl-badge { padding: 3px 7px; border-radius: 6px; background: rgba(240, 185, 11, 0.15); color: var(--gold); font-size: 11px; font-weight: 800; }
.cash-display { font-size: 14px; font-weight: 800; color: var(--green); }

/* Main Content Area */
.content-area {
  flex: 1; height: calc(100dvh - var(--header-h) - var(--nav-h));
  overflow-y: auto; position: relative;
}

/* Bottom Navigation Bar (Mobile Native Style) */
.bottom-nav {
  height: var(--nav-h); flex-shrink: 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bg-card); border-top: 1px solid var(--border); z-index: 100;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-muted); font-size: 10.5px; font-weight: 700; cursor: pointer; transition: 0.15s;
}
.nav-item.active { color: var(--blue); }
.nav-item svg { width: 20px; height: 20px; stroke-width: 2.2; }

/* =========================================================================
   5. TERMINAL & MARKET VIEWS
   ========================================================================= */
.page { height: 100%; display: flex; flex-direction: column; animation: slideUp 0.2s ease-out; }

/* Market Grid List */
.market-list { display: flex; flex-direction: column; }
.coin-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.coin-row:active { background: rgba(255,255,255,0.02); }
.coin-left { display: flex; align-items: center; gap: 10px; }
.coin-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; }
.coin-symbol { font-weight: 800; font-size: 14px; }
.coin-name { font-size: 11px; color: var(--text-muted); }
.coin-right { text-align: right; }
.coin-price { font-weight: 800; font-size: 14px; }
.coin-chg { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
.coin-chg.up { color: var(--green); background: var(--green-bg); }
.coin-chg.down { color: var(--red); background: var(--red-bg); }

/* Fullscreen Terminal Screen */
.terminal-screen { display: flex; flex-direction: column; height: 100%; }
.terminal-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--bg-main); border-bottom: 1px solid var(--border);
}
.tf-selector { display: flex; gap: 4px; }
.tf-btn { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--text-muted); background: transparent; border: none; cursor: pointer; }
.tf-btn.active { color: var(--text-main); background: var(--bg-panel); }

.chart-box { flex: 1; position: relative; width: 100%; min-height: 180px; background: var(--bg-main); }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.trade-panel-bottom {
  background: var(--bg-card); border-top: 1px solid var(--border); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.order-type-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pct-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

/* Orderbook Mini Component */
.orderbook-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; padding: 8px 14px; background: var(--bg-card); border-top: 1px solid var(--border); }
.ob-row { display: flex; justify-content: space-between; padding: 2px 0; }

/* =========================================================================
   6. PORTFOLIO, SHOP & PROFILE VIEWS
   ========================================================================= */
.padding-box { padding: 14px; }
.card-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.stat-item label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.stat-item .val { font-size: 16px; font-weight: 800; margin-top: 2px; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.shop-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }

/* Avatar System */
.av-box { position: relative; width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0; }
.av-ring { position: absolute; inset: -2px; border-radius: 50%; z-index: 1; }
.av-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--bg-panel); display: grid; place-items: center; z-index: 2; font-weight: 800; font-size: 13px; }
.av-inner img { width: 100%; height: 100%; object-fit: cover; }

/* Toast Notifications */
#toast-container { position: fixed; top: 12px; left: 14px; right: 14px; z-index: 1000; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
.toast { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); box-shadow: 0 8px 20px rgba(0,0,0,0.5); animation: fadeIn 0.2s ease; }
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.err { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<!-- =========================================================================
   AUTH SCREEN
   ========================================================================= -->
<div id="auth-screen" class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-icon">TM</div>
    <h2 style="font-size:20px; font-weight:900;">TradeMD.gg</h2>
    <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Мобильный трейдинг-симулятор</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="setAuthTab('login')">Вход</button>
      <button class="auth-tab" id="tab-reg" onclick="setAuthTab('register')">Регистрация</button>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="field">
        <label>Логин</label>
        <input type="text" id="auth-login" class="inp" placeholder="trader" required maxlength="16">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="auth-pass" class="inp" placeholder="••••••••" required>
      </div>

      <div id="reg-box" class="hidden">
        <div class="field">
          <label>Повторите пароль</label>
          <input type="password" id="auth-pass2" class="inp" placeholder="••••••••">
        </div>
        <div class="field">
          <label>Капча</label>
          <div class="captcha-box">
            <canvas id="captcha-canvas" width="140" height="38"></canvas>
            <button type="button" class="btn sm" onclick="initCaptcha()">↻</button>
          </div>
          <input type="text" id="auth-captcha" class="inp mono" placeholder="XXXXX" maxlength="5" style="text-transform:uppercase;">
        </div>
      </div>

      <button type="submit" id="auth-btn" class="btn primary full" style="margin-top:6px;">Войти</button>
      <div id="auth-err" class="err-msg"></div>
    </form>
  </div>
</div>

<!-- =========================================================================
   MAIN APPLICATION LAYOUT
   ========================================================================= -->
<div id="app-screen" class="app-layout hidden">
  <header class="header">
    <div class="user-pill">
      <div id="hdr-avatar-slot"></div>
      <div>
        <div id="hdr-username" style="font-weight:800; font-size:13px;">---</div>
        <div class="lvl-badge" id="hdr-lvl">LVL 1</div>
      </div>
    </div>
    <div class="cash-display mono" id="hdr-cash">$0.00</div>
  </header>

  <main class="content-area" id="main-view"></main>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchNav('market')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <span>Рынки</span>
    </div>
    <div class="nav-item" onclick="switchNav('trade')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Торговля</span>
    </div>
    <div class="nav-item" onclick="switchNav('portfolio')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 12V7H3v5"/><path d="M3 12v7h18v-7"/><path d="M12 12v.01"/></svg>
      <span>Портфель</span>
    </div>
    <div class="nav-item" onclick="switchNav('profile')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Профиль</span>
    </div>
  </nav>
</div>

<div id="toast-container"></div>
<input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="uploadAvatar(event)">

<script>
/* =========================================================================
   1. ИГРОВЫЕ ДАННЫЕ И КОНСТАНТЫ
   ========================================================================= */
const ASSETS = {
  MDC: { name: 'Mendeleev Coin', symbol: 'MDC', color: '#2962ff', price: 140.00 },
  PDL: { name: 'Poodle Token', symbol: 'PDL', color: '#9d56ff', price: 42.50 },
  CNC: { name: 'ChainCore', symbol: 'CNC', color: '#0ecb81', price: 15.20 },
  BCC: { name: 'BitCore Cash', symbol: 'BCC', color: '#f0b90b', price: 480.00 }
};

const SHOP = {
  frames: [
    { id: 'fr_base', name: 'Обычная', price: 0, style: 'border:2px solid var(--border)' },
    { id: 'fr_blue', name: 'Неон Синий', price: 2500, style: 'border:2px solid #2962ff; box-shadow:0 0 8px #2962ff' },
    { id: 'fr_gold', name: 'Золото', price: 10000, style: 'border:2px solid #f0b90b; box-shadow:0 0 8px #f0b90b' },
    { id: 'fr_red', name: 'Огонь', price: 25000, style: 'border:2px solid #f6465d; box-shadow:0 0 10px #f6465d' }
  ],
  nicks: [
    { id: 'nk_base', name: 'Стандарт', price: 0, color: 'var(--text-main)' },
    { id: 'nk_blue', name: 'Неон', price: 3000, color: '#2962ff' },
    { id: 'nk_green', name: 'Профи', price: 7000, color: '#0ecb81' },
    { id: 'nk_gold', name: 'VIP Gold', price: 15000, color: '#f0b90b' }
  ]
};

const PROMOS = {
  'START2026': { cash: 5000, msg: '+ $5,000 на счёт!' },
  'TRADEMD': { cash: 12000, msg: '+ $12,000 бонуса!' },
  'PUMPKIN': { frame: 'fr_gold', msg: 'Золотая рамка разблокирована!' }
};

/* =========================================================================
   2. ЛОКАЛЬНОЕ ХРАНИЛИЩЕ И СОСТОЯНИЕ
   ========================================================================= */
let DB = {
  users: JSON.parse(localStorage.getItem('tm_users_v3') || '{}'),
  session: localStorage.getItem('tm_session_v3') || null
};

let marketHistory = {};
let currentNav = 'market';
let activeSym = 'MDC';
let captchaCode = '';
let authMode = 'login';

// Инициализация котировок
Object.keys(ASSETS).forEach(s => {
  const base = ASSETS[s].price;
  marketHistory[s] = Array.from({length: 35}, () => base + (Math.random() * 4 - 2));
});

function saveDB() {
  localStorage.setItem('tm_users_v3', JSON.stringify(DB.users));
  if (DB.session) localStorage.setItem('tm_session_v3', DB.session);
  else localStorage.removeItem('tm_session_v3');
}

function getUser() {
  return DB.session ? DB.users[DB.session] : null;
}

function fmtUSD(v) {
  return '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getReqXP(lvl) {
  return Math.floor(100 * Math.pow(lvl, 1.3));
}

function addXP(u, amount) {
  u.xp += amount;
  let req = getReqXP(u.level);
  let leveled = false;
  while (u.xp >= req) {
    u.xp -= req;
    u.level++;
    req = getReqXP(u.level);
    leveled = true;
  }
  if (leveled) {
    toast(`Новый уровень: ${u.level}!`, 'ok');
    if (typeof confetti === 'function') confetti({ particleCount: 70, origin: { y: 0.7 } });
  }
  saveDB();
  renderHeader();
}

/* =========================================================================
   3. РЕАЛЬНЫЙ ТИКЕР РЫНКА (TICKER)
   ========================================================================= */
setInterval(() => {
  Object.keys(ASSETS).forEach(s => {
    const hist = marketHistory[s];
    const lastP = hist[hist.length - 1];
    const delta = (Math.random() - 0.495) * (lastP * 0.015);
    const newP = Math.max(0.1, lastP + delta);

    hist.push(newP);
    if (hist.length > 40) hist.shift();

    ASSETS[s].price = newP;
  });

  if (DB.session) {
    renderHeader();
    if (currentNav === 'market') renderMarketRows();
    if (currentNav === 'trade') {
      updateTradeHeader();
      drawChart();
    }
  }
}, 1600);

/* =========================================================================
   4. CANVAS ГРАФИК ТЕРМИНАЛА (LIGHTWEIGHT & SMOOTH)
   ========================================================================= */
function drawChart() {
  const canvas = document.getElementById('chart-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;

  const w = canvas.width = parent.clientWidth;
  const h = canvas.height = parent.clientHeight;
  ctx.clearRect(0, 0, w, h);

  const data = marketHistory[activeSym];
  if (!data || data.length === 0) return;

  const color = ASSETS[activeSym].color;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = (max - min) || 1;

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const pts = data.map((v, i) => ({
    x: (i / (data.length - 1)) * w,
    y: h - ((v - min) / range) * (h - 24) - 12
  }));

  // Line
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const xc = (pts[i].x + pts[i - 1].x) / 2;
    const yc = (pts[i].y + pts[i - 1].y) / 2;
    ctx.quadraticCurveTo(pts[i - 1].x, pts[i - 1].y, xc, yc);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Gradient Fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '30');
  grad.addColorStop(1, color + '00');
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Pulse Point
  const last = pts[pts.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

/* =========================================================================
   5. UI РЕНДЕРИНГ И НАВИГАЦИЯ
   ========================================================================= */
function renderAvatarHTML(u, size = 32) {
  const frameObj = SHOP.frames.find(f => f.id === u.frame) || SHOP.frames[0];
  const initials = u.login.substring(0, 2).toUpperCase();
  const inner = u.customAvatar ? `<img src="${u.customAvatar}">` : `<span>${initials}</span>`;

  return `
    <div class="av-box" style="width:${size}px; height:${size}px;">
      <div class="av-ring" style="${frameObj.style}"></div>
      <div class="av-inner">${inner}</div>
    </div>
  `;
}

function renderHeader() {
  const u = getUser();
  if (!u) return;
  document.getElementById('hdr-cash').textContent = fmtUSD(u.cash);
  document.getElementById('hdr-lvl').textContent = `LVL ${u.level}`;
  document.getElementById('hdr-avatar-slot').innerHTML = renderAvatarHTML(u, 32);

  const nickObj = SHOP.nicks.find(n => n.id === u.nickColor) || SHOP.nicks[0];
  const unameEl = document.getElementById('hdr-username');
  unameEl.textContent = u.login;
  unameEl.style.color = nickObj.color;
}

function switchNav(target) {
  currentNav = target;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.remove('active');
    if (el.getAttribute('onclick').includes(target)) el.classList.add('active');
  });

  const main = document.getElementById('main-view');
  const u = getUser();

  if (target === 'market') renderMarketView(main);
  else if (target === 'trade') renderTradeView(main, u);
  else if (target === 'portfolio') renderPortfolioView(main, u);
  else if (target === 'profile') renderProfileView(main, u);
}

/* ЭКРАН 1: РЫНОК */
function renderMarketView(container) {
  container.className = 'content-area page';
  container.innerHTML = `
    <div class="padding-box">
      <h3 style="font-weight:900; font-size:18px; margin-bottom:10px;">Криптовалютный Рынок</h3>
      <div class="market-list" id="market-rows-container"></div>
    </div>
  `;
  renderMarketRows();
}

function renderMarketRows() {
  const container = document.getElementById('market-rows-container');
  if (!container) return;

  container.innerHTML = Object.keys(ASSETS).map(s => {
    const a = ASSETS[s];
    const hist = marketHistory[s];
    const first = hist[0];
    const pct = ((a.price - first) / first * 100).toFixed(2);
    const isUp = pct >= 0;

    return `
      <div class="coin-row" onclick="openTradeForSymbol('${s}')">
        <div class="coin-left">
          <div class="coin-icon" style="background:${a.color};">${s.substring(0,2)}</div>
          <div>
            <div class="coin-symbol">${s}</div>
            <div class="coin-name">${a.name}</div>
          </div>
        </div>
        <div class="coin-right">
          <div class="coin-price mono">${fmtUSD(a.price)}</div>
          <div class="coin-chg ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${pct}%</div>
        </div>
      </div>
    `;
  }).join('');
}

function openTradeForSymbol(s) {
  activeSym = s;
  switchNav('trade');
}

/* ЭКРАН 2: ТЕРМИНАЛ ТОРГОВЛИ */
function renderTradeView(container, u) {
  const owned = u.portfolio[activeSym] || 0;
  container.className = 'content-area page terminal-screen';
  container.innerHTML = `
    <div class="terminal-bar">
      <div>
        <b style="font-size:16px;" id="tr-sym">${activeSym}/USD</b>
        <div class="mono" style="font-size:14px; font-weight:800; color:${ASSETS[activeSym].color};" id="tr-price">${fmtUSD(ASSETS[activeSym].price)}</div>
      </div>
      <div class="tf-selector">
        <button class="tf-btn active">1M</button>
        <button class="tf-btn">5M</button>
        <button class="tf-btn">1H</button>
      </div>
    </div>

    <div class="chart-box">
      <canvas id="chart-canvas"></canvas>
    </div>

    <div class="orderbook-mini">
      <div>
        <div style="color:var(--text-muted); margin-bottom:4px;">Продажи (Ask)</div>
        <div class="ob-row mono" style="color:var(--red);"><span>${(ASSETS[activeSym].price * 1.002).toFixed(2)}</span><span>0.42</span></div>
        <div class="ob-row mono" style="color:var(--red);"><span>${(ASSETS[activeSym].price * 1.001).toFixed(2)}</span><span>1.15</span></div>
      </div>
      <div>
        <div style="color:var(--text-muted); margin-bottom:4px;">Покупки (Bid)</div>
        <div class="ob-row mono" style="color:var(--green);"><span>${(ASSETS[activeSym].price * 0.999).toFixed(2)}</span><span>0.88</span></div>
        <div class="ob-row mono" style="color:var(--green);"><span>${(ASSETS[activeSym].price * 0.998).toFixed(2)}</span><span>2.04</span></div>
      </div>
    </div>

    <div class="trade-panel-bottom">
      <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted);">
        <span>Доступно: <b class="mono" style="color:var(--text-main);">${fmtUSD(u.cash)}</b></span>
        <span>Баланс: <b class="mono" style="color:var(--text-main);">${owned.toFixed(4)} ${activeSym}</b></span>
      </div>

      <div class="field" style="margin-bottom:0;">
        <input type="number" id="trade-qty" class="inp mono" placeholder="Количество" step="any" oninput="calcTradeTotal()">
      </div>

      <div class="pct-btns">
        <button class="btn sm" onclick="setQuickPct(0.25)">25%</button>
        <button class="btn sm" onclick="setQuickPct(0.50)">50%</button>
        <button class="btn sm" onclick="setQuickPct(0.75)">75%</button>
        <button class="btn sm" onclick="setQuickPct(1.00)">100%</button>
      </div>

      <div style="font-size:12px; display:flex; justify-content:space-between; margin-bottom:2px;">
        <span style="color:var(--text-muted);">Стоимость:</span>
        <b class="mono" id="trade-total-val">$0.00</b>
      </div>

      <div class="order-type-tabs">
        <button class="btn buy full" onclick="doTrade('buy')">Купить ${activeSym}</button>
        <button class="btn sell full" onclick="doTrade('sell')" ${owned <= 0 ? 'disabled' : ''}>Продать</button>
      </div>
    </div>
  `;

  setTimeout(() => drawChart(), 40);
}

function updateTradeHeader() {
  const p = document.getElementById('tr-price');
  if (p) p.textContent = fmtUSD(ASSETS[activeSym].price);
}

function calcTradeTotal() {
  const qty = parseFloat(document.getElementById('trade-qty').value) || 0;
  const tot = document.getElementById('trade-total-val');
  if (tot) tot.textContent = fmtUSD(qty * ASSETS[activeSym].price);
}

function setQuickPct(pct) {
  const u = getUser();
  const price = ASSETS[activeSym].price;
  const inp = document.getElementById('trade-qty');
  if (!inp) return;

  const availUSD = u.cash * pct;
  const qty = availUSD / price;
  inp.value = qty.toFixed(4);
  calcTradeTotal();
}

function doTrade(type) {
  const u = getUser();
  const price = ASSETS[activeSym].price;
  const inp = document.getElementById('trade-qty');
  const qty = parseFloat(inp.value) || 0;

  if (qty <= 0) {
    toast('Введите количество!', 'err');
    return;
  }

  const cost = qty * price;

  if (type === 'buy') {
    if (u.cash < cost) {
      toast('Недостаточно средств!', 'err');
      return;
    }
    const currQty = u.portfolio[activeSym] || 0;
    const currAvg = u.buyPrices[activeSym] || price;
    const newQty = currQty + qty;
    const newAvg = ((currQty * currAvg) + cost) / newQty;

    u.cash -= cost;
    u.portfolio[activeSym] = newQty;
    u.buyPrices[activeSym] = newAvg;
    addXP(u, Math.max(5, Math.floor(cost / 40)));

  } else {
    const currQty = u.portfolio[activeSym] || 0;
    if (currQty < qty) {
      toast('Нельзя продать больше имеющегося!', 'err');
      return;
    }
    u.cash += cost;
    u.portfolio[activeSym] = currQty - qty;
    if (u.portfolio[activeSym] <= 0.0001) {
      delete u.portfolio[activeSym];
      delete u.buyPrices[activeSym];
    }
    addXP(u, Math.max(5, Math.floor(cost / 40)));
  }

  saveDB();
  toast('Сделка проведена!', 'ok');
  renderTradeView(document.getElementById('main-view'), u);
  renderHeader();
}

/* ЭКРАН 3: ПОРТФЕЛЬ */
function renderPortfolioView(container, u) {
  container.className = 'content-area page padding-box';
  let cryptoVal = 0, totalCost = 0;

  Object.keys(u.portfolio).forEach(s => {
    const q = u.portfolio[s];
    if (q > 0) {
      cryptoVal += q * ASSETS[s].price;
      totalCost += (u.buyPrices[s] || ASSETS[s].price) * q;
    }
  });

  const totalCap = u.cash + cryptoVal;
  const pnl = cryptoVal - totalCost;

  container.innerHTML = `
    <h3 style="font-weight:900; font-size:18px; margin-bottom:12px;">Мой Портфель</h3>

    <div class="stat-grid">
      <div class="stat-item">
        <label>Капитал</label>
        <div class="val mono" style="color:var(--blue);">${fmtUSD(totalCap)}</div>
      </div>
      <div class="stat-item">
        <label>PnL Сделок</label>
        <div class="val mono" style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'};">
          ${pnl >= 0 ? '+' : ''}${fmtUSD(pnl)}
        </div>
      </div>
    </div>

    <div class="card-panel">
      <h4 style="font-weight:800; margin-bottom:10px;">Активные Активы</h4>
      ${Object.keys(u.portfolio).filter(s => u.portfolio[s] > 0).map(s => {
        const q = u.portfolio[s];
        const currP = ASSETS[s].price;
        const avgP = u.buyPrices[s] || currP;
        const val = q * currP;
        const itemPnl = (currP - avgP) * q;

        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
            <div>
              <b style="color:${ASSETS[s].color};">${s}</b>
              <div style="font-size:11px; color:var(--text-muted);">${q.toFixed(4)} по ${fmtUSD(avgP)}</div>
            </div>
            <div style="text-align:right;">
              <div class="mono" style="font-weight:800;">${fmtUSD(val)}</div>
              <div class="mono" style="font-size:11px; color:${itemPnl >= 0 ? 'var(--green)' : 'var(--red)'};">
                ${itemPnl >= 0 ? '+' : ''}${fmtUSD(itemPnl)}
              </div>
            </div>
          </div>
        `;
      }).join('') || '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:10px 0;">У вас нет открытых позиций</div>'}
    </div>
  `;
}

/* ЭКРАН 4: ПРОФИЛЬ & МАГАЗИН */
function renderProfileView(container, u) {
  container.className = 'content-area page padding-box';
  const req = getReqXP(u.level);
  const pct = Math.min(100, Math.floor((u.xp / req) * 100));

  container.innerHTML = `
    <div class="card-panel" style="display:flex; align-items:center; gap:14px;">
      ${renderAvatarHTML(u, 52)}
      <div>
        <h3 style="font-weight:900; font-size:17px;">${u.login}</h3>
        <div style="font-size:12px; color:var(--text-muted);">Прогресс XP: ${u.xp} / ${req} (${pct}%)</div>
      </div>
    </div>

    <div class="card-panel">
      <h4 style="font-weight:800; margin-bottom:8px;">🎁 Промокод</h4>
      <div style="display:flex; gap:8px;">
        <input type="text" id="promo-code" class="inp mono" placeholder="START2026" style="text-transform:uppercase;">
        <button class="btn primary sm" onclick="usePromo()">Ввести</button>
      </div>
    </div>

    <h4 style="font-weight:800; margin-bottom:10px;">Магазин Кастомизации</h4>
    <div class="shop-grid">
      ${SHOP.frames.map(f => {
        const owned = u.inventory.includes(f.id);
        const active = u.frame === f.id;
        return `
          <div class="shop-card">
            <div class="av-box" style="width:36px; height:36px; margin:0 auto 8px;">
              <div class="av-ring" style="${f.style}"></div>
              <div class="av-inner">TM</div>
            </div>
            <div style="font-size:12px; font-weight:800;">${f.name}</div>
            <div style="font-size:11px; color:var(--gold); margin:4px 0;" class="mono">${f.price === 0 ? 'Free' : fmtUSD(f.price)}</div>
            ${active ? '<button class="btn sm full" disabled>Надето</button>' :
              owned ? `<button class="btn sm full" onclick="equip('frame','${f.id}')">Надеть</button>` :
              `<button class="btn sm buy full" onclick="buyItem('${f.id}',${f.price},'frame')">Купить</button>`
            }
          </div>
        `;
      }).join('')}
    </div>

    <button class="btn full sm" onclick="logout()" style="margin-top:20px; color:var(--red);">Выйти из аккаунта</button>
  `;
}

function buyItem(id, price, type) {
  const u = getUser();
  if (u.cash < price) {
    toast('Недостаточно средств!', 'err');
    return;
  }
  u.cash -= price;
  u.inventory.push(id);
  u[type] = id;
  saveDB();
  toast('Куплено и применено!', 'ok');
  renderProfileView(document.getElementById('main-view'), u);
  renderHeader();
}

function equip(type, id) {
  const u = getUser();
  u[type] = id;
  saveDB();
  toast('Стиль обновлен', 'ok');
  renderProfileView(document.getElementById('main-view'), u);
  renderHeader();
}

function usePromo() {
  const inp = document.getElementById('promo-code');
  if (!inp) return;
  const code = inp.value.trim().toUpperCase();
  const u = getUser();

  if (u.promos.includes(code)) {
    toast('Код уже использован!', 'err');
    return;
  }
  const p = PROMOS[code];
  if (!p) {
    toast('Неверный код!', 'err');
    return;
  }

  u.promos.push(code);
  if (p.cash) u.cash += p.cash;
  if (p.frame && !u.inventory.includes(p.frame)) u.inventory.push(p.frame);

  saveDB();
  toast(p.msg, 'ok');
  renderProfileView(document.getElementById('main-view'), u);
  renderHeader();
}

/* =========================================================================
   6. АВТОРИЗАЦИЯ И КАПЧА
   ========================================================================= */
function initCaptcha() {
  const canvas = document.getElementById('captcha-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f131d'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
  captchaCode = code;

  ctx.font = 'bold 18px "JetBrains Mono", monospace';
  ctx.fillStyle = '#2962ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(code, canvas.width / 2, canvas.height / 2);
}

function setAuthTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').className = `auth-tab ${mode === 'login' ? 'active' : ''}`;
  document.getElementById('tab-reg').className = `auth-tab ${mode === 'register' ? 'active' : ''}`;
  document.getElementById('reg-box').className = mode === 'register' ? '' : 'hidden';
  document.getElementById('auth-btn').textContent = mode === 'register' ? 'Зарегистрироваться' : 'Войти';
  if (mode === 'register') initCaptcha();
}

function handleAuth(e) {
  e.preventDefault();
  const login = document.getElementById('auth-login').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-err');
  err.textContent = '';

  if (authMode === 'register') {
    const pass2 = document.getElementById('auth-pass2').value;
    const captcha = document.getElementById('auth-captcha').value.trim().toUpperCase();

    if (pass !== pass2) { err.textContent = 'Пароли не совпадают'; return; }
    if (captcha !== captchaCode) { err.textContent = 'Неверная капча'; initCaptcha(); return; }
    if (DB.users[login.toLowerCase()]) { err.textContent = 'Логин занят'; return; }

    DB.users[login.toLowerCase()] = {
      login: login, pass: pass, cash: 10000, level: 1, xp: 0,
      portfolio: {}, buyPrices: {}, inventory: ['fr_base', 'nk_base'],
      frame: 'fr_base', nickColor: 'nk_base', promos: []
    };
    DB.session = login.toLowerCase();
    saveDB();
    initApp();

  } else {
    const u = DB.users[login.toLowerCase()];
    if (!u || u.pass !== pass) { err.textContent = 'Неверный логин/пароль'; return; }
    DB.session = login.toLowerCase();
    saveDB();
    initApp();
  }
}

function logout() {
  DB.session = null;
  saveDB();
  initApp();
}

function toast(msg, type = 'ok') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 2400);
}

function initApp() {
  const u = getUser();
  if (u) {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    renderHeader();
    switchNav('market');
  } else {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
  }
}

window.onload = () => initApp();
</script>
